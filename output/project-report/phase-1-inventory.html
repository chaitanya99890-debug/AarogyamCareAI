<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AarogyamCareAI — Phase 1 Evidence Inventory</title>
  <style>
    @page { size: A4; margin: 18mm 16mm 18mm 16mm; }
    * { box-sizing: border-box; }
    body { color: #172033; font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.45; margin: 0; }
    h1 { font-size: 19pt; line-height: 1.18; margin: 0 0 5pt; color: #123451; }
    h2 { font-size: 15pt; line-height: 1.2; margin: 20pt 0 7pt; color: #123451; page-break-after: avoid; }
    h3 { font-size: 13pt; margin: 14pt 0 5pt; color: #1b4b6e; page-break-after: avoid; }
    p { margin: 0 0 8pt; text-align: justify; }
    ul, ol { margin: 0 0 9pt 20pt; padding-left: 14pt; }
    li { margin-bottom: 3pt; }
    table { border-collapse: collapse; width: 100%; font-size: 9.3pt; margin: 8pt 0 12pt; page-break-inside: auto; }
    thead { display: table-header-group; background: #dcecf6; }
    tr { page-break-inside: avoid; }
    th, td { border: 0.6pt solid #6b7b8a; padding: 5pt; vertical-align: top; text-align: left; }
    th { font-weight: bold; }
    pre { background: #f1f5f8; border-left: 3pt solid #2a6d9b; font-family: Consolas, monospace; font-size: 8.8pt; line-height: 1.25; margin: 9pt 0 12pt; padding: 8pt; white-space: pre-wrap; }
    code { font-family: Consolas, monospace; font-size: 9.4pt; }
    .subtitle { color: #435c70; margin-bottom: 15pt; }
    .notice { background: #fff4db; border-left: 3pt solid #d48b00; padding: 8pt 10pt; margin: 10pt 0 14pt; }
    .footer { color: #5d6974; font-size: 9pt; margin-top: 18pt; }
    .error { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <main id="content"><p>Rendering document…</p></main>
  <script>
    const escapeHtml = (s) => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const inline = (s) => escapeHtml(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span>$1</span>');
    function render(md) {
      const lines = md.replace(/\r/g, '').split('\n'); let out = ''; let i = 0;
      const isTable = (line) => /^\|.*\|\s*$/.test(line);
      const cells = (line) => line.trim().slice(1, -1).split('|').map(x => inline(x.trim()));
      while (i < lines.length) {
        const line = lines[i];
        if (/^```/.test(line)) { let code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); out += '<pre>'+escapeHtml(code.join('\n'))+'</pre>'; i++; continue; }
        if (isTable(line) && i + 1 < lines.length && /^\|\s*:?-+/.test(lines[i + 1])) {
          const header = cells(line); i += 2; let rows = [];
          while (i < lines.length && isTable(lines[i])) rows.push(cells(lines[i++]));
          out += '<table><thead><tr>'+header.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) { const level = heading[1].length; out += `<h${level}>${inline(heading[2])}</h${level}>`; i++; continue; }
        const ordered = line.match(/^\d+\.\s+(.+)$/); const bullet = line.match(/^-\s+(.+)$/);
        if (ordered || bullet) { const tag = ordered ? 'ol' : 'ul'; let items = []; while (i < lines.length) { const m = ordered ? lines[i].match(/^\d+\.\s+(.+)$/) : lines[i].match(/^-\s+(.+)$/); if (!m) break; items.push('<li>'+inline(m[1])+'</li>'); i++; } out += `<${tag}>${items.join('')}</${tag}>`; continue; }
        if (!line.trim()) { i++; continue; }
        out += '<p>'+inline(line)+'</p>'; i++;
      }
      return out;
    }
    fetch('documentation_phase1_inventory.md').then(r => { if (!r.ok) throw new Error('Unable to read the Markdown source.'); return r.text(); })
      .then(md => { document.getElementById('content').innerHTML = render(md) + '<p class="footer">Generated from the repository’s Phase 1 evidence inventory. This document is not the final MCA project report.</p>'; document.title = 'AarogyamCareAI_Phase_1_Evidence_Inventory'; document.body.dataset.ready = 'true'; })
      .catch(err => { document.getElementById('content').innerHTML = '<p class="error">'+escapeHtml(err.message)+'</p>'; document.body.dataset.ready = 'error'; });
  </script>
</body>
</html>
